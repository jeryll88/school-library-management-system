services:
  - type: web
    name: school-library-management-system
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/index.php
    envVars:
      - key: DATABASE_URL
        sync: false # Set to your Neon PostgreSQL connection string in Render dashboard
      - key: APP_ENV
        value: production
